<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="feat-t feat-d">
<title id="feat-t">Pose Heatmaps features</title>
<desc id="feat-d">Peak confidence: The heatmap maximum: MMPose's own keypoint score.; Spread: Spatial standard deviation of the blob. Wide means the location is uncertain.; Second peak: Near 1 means the model is torn between two places, like left and right.; Unreliable flags: Peak &lt; 0.3, spread &gt; 8% of the box, or second peak &gt; 0.5. All adjustable.; Kinovea validation: Keypoint error, RMSE, PCK, joint-angle MAE and Bland–Altman.; Colab ready: One notebook writes all the code itself. Just pick a GPU runtime.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="feat-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#0E2E20"/><stop offset=".55" stop-color="#081A12"/><stop offset="1" stop-color="#04100B"/></radialGradient>
<radialGradient id="feat-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#138A5A" stop-opacity=".5"/><stop offset="1" stop-color="#138A5A" stop-opacity="0"/></radialGradient>
<radialGradient id="feat-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E6C35C" stop-opacity=".14"/><stop offset="1" stop-color="#E6C35C" stop-opacity="0"/></radialGradient>
<linearGradient id="feat-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F5E2A0"/><stop offset="1" stop-color="#E6C35C"/></linearGradient>
<linearGradient id="feat-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6C35C" stop-opacity="0"/><stop offset=".25" stop-color="#E6C35C" stop-opacity=".85"/><stop offset="1" stop-color="#E6C35C" stop-opacity="0"/></linearGradient>
<pattern id="feat-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E6C35C" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="398" rx="22" fill="url(#feat-bg)" stroke="#163A2A"/>
<rect x="1" y="1" width="1198" height="398" rx="22" fill="url(#feat-grid)"/>
<ellipse cx="240" cy="120" rx="420" ry="280" fill="url(#feat-glowA)"/>
<ellipse cx="960" cy="280" rx="300" ry="200" fill="url(#feat-glowB)"/><rect x="40" y="40" width="360" height="150" rx="16" fill="#0B2218" stroke="#22573F"/>
<circle cx="74" cy="76" r="17" fill="#04100B" stroke="#E6C35C"/>
<text x="74" y="82" class="sans" font-size="16" fill="#F5E2A0" text-anchor="middle" >▲</text>
<text x="102" y="82" class="serif" font-size="19" fill="#EFF6F0" text-anchor="start" >Peak confidence</text>
<text x="62" y="122" class="sans" font-size="13" fill="#C6D9CD" text-anchor="start" >The heatmap maximum: MMPose's own keypoint</text><text x="62" y="142" class="sans" font-size="13" fill="#8FAA9A" text-anchor="start" >score.</text>
<rect x="62" y="176" width="34" height="2" rx="1" fill="#E6C35C"><animate attributeName="width" values="34;316;34" dur="6s" repeatCount="indefinite"/></rect><rect x="420" y="40" width="360" height="150" rx="16" fill="#0B2218" stroke="#22573F"/>
<circle cx="454" cy="76" r="17" fill="#04100B" stroke="#E6C35C"/>
<text x="454" y="82" class="sans" font-size="16" fill="#F5E2A0" text-anchor="middle" >◎</text>
<text x="482" y="82" class="serif" font-size="19" fill="#EFF6F0" text-anchor="start" >Spread</text>
<text x="442" y="122" class="sans" font-size="13" fill="#C6D9CD" text-anchor="start" >Spatial standard deviation of the blob. Wide</text><text x="442" y="142" class="sans" font-size="13" fill="#8FAA9A" text-anchor="start" >means the location is uncertain.</text>
<rect x="442" y="176" width="34" height="2" rx="1" fill="#E6C35C"><animate attributeName="width" values="34;316;34" dur="7s" repeatCount="indefinite"/></rect><rect x="800" y="40" width="360" height="150" rx="16" fill="#0B2218" stroke="#22573F"/>
<circle cx="834" cy="76" r="17" fill="#04100B" stroke="#E6C35C"/>
<text x="834" y="82" class="sans" font-size="16" fill="#F5E2A0" text-anchor="middle" >◇</text>
<text x="862" y="82" class="serif" font-size="19" fill="#EFF6F0" text-anchor="start" >Second peak</text>
<text x="822" y="122" class="sans" font-size="13" fill="#C6D9CD" text-anchor="start" >Near 1 means the model is torn between two</text><text x="822" y="142" class="sans" font-size="13" fill="#8FAA9A" text-anchor="start" >places, like left and right.</text>
<rect x="822" y="176" width="34" height="2" rx="1" fill="#E6C35C"><animate attributeName="width" values="34;316;34" dur="8s" repeatCount="indefinite"/></rect><rect x="40" y="210" width="360" height="150" rx="16" fill="#0B2218" stroke="#22573F"/>
<circle cx="74" cy="246" r="17" fill="#04100B" stroke="#E6C35C"/>
<text x="74" y="252" class="sans" font-size="16" fill="#F5E2A0" text-anchor="middle" >⚑</text>
<text x="102" y="252" class="serif" font-size="19" fill="#EFF6F0" text-anchor="start" >Unreliable flags</text>
<text x="62" y="292" class="sans" font-size="13" fill="#C6D9CD" text-anchor="start" >Peak &lt; 0.3, spread &gt; 8% of the box, or second</text><text x="62" y="312" class="sans" font-size="13" fill="#8FAA9A" text-anchor="start" >peak &gt; 0.5. All adjustable.</text>
<rect x="62" y="346" width="34" height="2" rx="1" fill="#E6C35C"><animate attributeName="width" values="34;316;34" dur="9s" repeatCount="indefinite"/></rect><rect x="420" y="210" width="360" height="150" rx="16" fill="#0B2218" stroke="#22573F"/>
<circle cx="454" cy="246" r="17" fill="#04100B" stroke="#E6C35C"/>
<text x="454" y="252" class="sans" font-size="16" fill="#F5E2A0" text-anchor="middle" >⌖</text>
<text x="482" y="252" class="serif" font-size="19" fill="#EFF6F0" text-anchor="start" >Kinovea validation</text>
<text x="442" y="292" class="sans" font-size="13" fill="#C6D9CD" text-anchor="start" >Keypoint error, RMSE, PCK, joint-angle MAE and</text><text x="442" y="312" class="sans" font-size="13" fill="#8FAA9A" text-anchor="start" >Bland–Altman.</text>
<rect x="442" y="346" width="34" height="2" rx="1" fill="#E6C35C"><animate attributeName="width" values="34;316;34" dur="6s" repeatCount="indefinite"/></rect><rect x="800" y="210" width="360" height="150" rx="16" fill="#0B2218" stroke="#22573F"/>
<circle cx="834" cy="246" r="17" fill="#04100B" stroke="#E6C35C"/>
<text x="834" y="252" class="sans" font-size="16" fill="#F5E2A0" text-anchor="middle" >▶</text>
<text x="862" y="252" class="serif" font-size="19" fill="#EFF6F0" text-anchor="start" >Colab ready</text>
<text x="822" y="292" class="sans" font-size="13" fill="#C6D9CD" text-anchor="start" >One notebook writes all the code itself. Just</text><text x="822" y="312" class="sans" font-size="13" fill="#8FAA9A" text-anchor="start" >pick a GPU runtime.</text>
<rect x="822" y="346" width="34" height="2" rx="1" fill="#E6C35C"><animate attributeName="width" values="34;316;34" dur="7s" repeatCount="indefinite"/></rect>
</svg>
