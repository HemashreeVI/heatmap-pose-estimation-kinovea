<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 256" width="1200" height="256" role="img" aria-labelledby="stk-t stk-d">
<title id="stk-t">Pose Heatmaps tech stack</title>
<desc id="stk-d">Model: MMPose 1.3.2, HRNet-W32, PyTorch; Analysis: OpenCV, Matplotlib, NumPy · pandas; Validation: Kinovea, Bland–Altman, PCK · RMSE; Workflow: Google Colab, pytest, Python 3.10–3.12</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="stk-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#0E2E20"/><stop offset=".55" stop-color="#081A12"/><stop offset="1" stop-color="#04100B"/></radialGradient>
<radialGradient id="stk-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#138A5A" stop-opacity=".5"/><stop offset="1" stop-color="#138A5A" stop-opacity="0"/></radialGradient>
<radialGradient id="stk-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E6C35C" stop-opacity=".14"/><stop offset="1" stop-color="#E6C35C" stop-opacity="0"/></radialGradient>
<linearGradient id="stk-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F5E2A0"/><stop offset="1" stop-color="#E6C35C"/></linearGradient>
<linearGradient id="stk-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6C35C" stop-opacity="0"/><stop offset=".25" stop-color="#E6C35C" stop-opacity=".85"/><stop offset="1" stop-color="#E6C35C" stop-opacity="0"/></linearGradient>
<pattern id="stk-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E6C35C" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="254" rx="22" fill="url(#stk-bg)" stroke="#163A2A"/>
<rect x="1" y="1" width="1198" height="254" rx="22" fill="url(#stk-grid)"/>
<ellipse cx="600" cy="128" rx="420" ry="179" fill="url(#stk-glowA)"/>
<ellipse cx="600" cy="128" rx="300" ry="128" fill="url(#stk-glowB)"/><rect x="40" y="40" width="268" height="176" rx="16" fill="#0B2218" stroke="#22573F"/><text x="60" y="72" class="mono" font-size="11" fill="#E6C35C" text-anchor="start" letter-spacing="2.5">MODEL</text><text x="60" y="110" class="serif" font-size="22" fill="#EFF6F0" text-anchor="start" >MMPose 1.3.2</text><text x="60" y="146" class="serif" font-size="17" fill="#C6D9CD" text-anchor="start" >HRNet-W32</text><text x="60" y="177" class="serif" font-size="15" fill="#8FAA9A" text-anchor="start" >PyTorch</text><rect x="324" y="40" width="268" height="176" rx="16" fill="#0B2218" stroke="#22573F"/><text x="344" y="72" class="mono" font-size="11" fill="#E6C35C" text-anchor="start" letter-spacing="2.5">ANALYSIS</text><text x="344" y="110" class="serif" font-size="22" fill="#EFF6F0" text-anchor="start" >OpenCV</text><text x="344" y="146" class="serif" font-size="17" fill="#C6D9CD" text-anchor="start" >Matplotlib</text><text x="344" y="177" class="serif" font-size="15" fill="#8FAA9A" text-anchor="start" >NumPy · pandas</text><rect x="608" y="40" width="268" height="176" rx="16" fill="#0B2218" stroke="#22573F"/><text x="628" y="72" class="mono" font-size="11" fill="#E6C35C" text-anchor="start" letter-spacing="2.5">VALIDATION</text><text x="628" y="110" class="serif" font-size="22" fill="#EFF6F0" text-anchor="start" >Kinovea</text><text x="628" y="146" class="serif" font-size="17" fill="#C6D9CD" text-anchor="start" >Bland–Altman</text><text x="628" y="177" class="serif" font-size="15" fill="#8FAA9A" text-anchor="start" >PCK · RMSE</text><rect x="892" y="40" width="268" height="176" rx="16" fill="#0B2218" stroke="#22573F"/><text x="912" y="72" class="mono" font-size="11" fill="#E6C35C" text-anchor="start" letter-spacing="2.5">WORKFLOW</text><text x="912" y="110" class="serif" font-size="22" fill="#EFF6F0" text-anchor="start" >Google Colab</text><text x="912" y="146" class="serif" font-size="17" fill="#C6D9CD" text-anchor="start" >pytest</text><text x="912" y="177" class="serif" font-size="15" fill="#8FAA9A" text-anchor="start" >Python 3.10–3.12</text>
</svg>
