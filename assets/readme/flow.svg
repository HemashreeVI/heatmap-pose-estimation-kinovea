<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 228" width="1200" height="228" role="img" aria-labelledby="flow-t flow-d">
<title id="flow-t">How Pose Heatmaps works</title>
<desc id="flow-d">Detect (person box, Faster R-CNN) → Estimate (HRNet-W32 heatmaps) → Analyse (peak · spread · 2nd peak) → Validate (vs Kinovea: RMSE, PCK)</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="flow-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#0E2E20"/><stop offset=".55" stop-color="#081A12"/><stop offset="1" stop-color="#04100B"/></radialGradient>
<radialGradient id="flow-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#138A5A" stop-opacity=".5"/><stop offset="1" stop-color="#138A5A" stop-opacity="0"/></radialGradient>
<radialGradient id="flow-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E6C35C" stop-opacity=".14"/><stop offset="1" stop-color="#E6C35C" stop-opacity="0"/></radialGradient>
<linearGradient id="flow-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F5E2A0"/><stop offset="1" stop-color="#E6C35C"/></linearGradient>
<linearGradient id="flow-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6C35C" stop-opacity="0"/><stop offset=".25" stop-color="#E6C35C" stop-opacity=".85"/><stop offset="1" stop-color="#E6C35C" stop-opacity="0"/></linearGradient>
<pattern id="flow-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E6C35C" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="226" rx="22" fill="url(#flow-bg)" stroke="#163A2A"/>
<rect x="1" y="1" width="1198" height="226" rx="22" fill="url(#flow-grid)"/>
<ellipse cx="600" cy="114" rx="420" ry="160" fill="url(#flow-glowA)"/>
<ellipse cx="600" cy="114" rx="300" ry="114" fill="url(#flow-glowB)"/><g class="float" style="animation-delay:-0.0s">
<rect x="40" y="50" width="247" height="128" rx="18" fill="#0B2218" stroke="#22573F"/>
<circle cx="70" cy="82" r="13" fill="none" stroke="#E6C35C"/>
<circle cx="70" cy="82" r="4.5" fill="#F5E2A0" class="pulse" style="animation-delay:0.0s"/>
<text x="94" y="87" class="mono" font-size="11" fill="#8FAA9A" text-anchor="start" letter-spacing="2">01</text>
<text x="62" y="132" class="serif" font-size="26" fill="#EFF6F0" text-anchor="start" >Detect</text>
<text x="62" y="156" class="mono" font-size="12" fill="#C6D9CD" text-anchor="start" >person box, Faster R-CNN</text>
</g><g class="float" style="animation-delay:-0.7s">
<rect x="331" y="50" width="247" height="128" rx="18" fill="#0B2218" stroke="#22573F"/>
<circle cx="361" cy="82" r="13" fill="none" stroke="#E6C35C"/>
<circle cx="361" cy="82" r="4.5" fill="#F5E2A0" class="pulse" style="animation-delay:0.5s"/>
<text x="385" y="87" class="mono" font-size="11" fill="#8FAA9A" text-anchor="start" letter-spacing="2">02</text>
<text x="353" y="132" class="serif" font-size="26" fill="#EFF6F0" text-anchor="start" >Estimate</text>
<text x="353" y="156" class="mono" font-size="12" fill="#C6D9CD" text-anchor="start" >HRNet-W32 heatmaps</text>
</g><g class="float" style="animation-delay:-1.4s">
<rect x="622" y="50" width="247" height="128" rx="18" fill="#0B2218" stroke="#22573F"/>
<circle cx="652" cy="82" r="13" fill="none" stroke="#E6C35C"/>
<circle cx="652" cy="82" r="4.5" fill="#F5E2A0" class="pulse" style="animation-delay:1.0s"/>
<text x="676" y="87" class="mono" font-size="11" fill="#8FAA9A" text-anchor="start" letter-spacing="2">03</text>
<text x="644" y="132" class="serif" font-size="26" fill="#EFF6F0" text-anchor="start" >Analyse</text>
<text x="644" y="156" class="mono" font-size="12" fill="#C6D9CD" text-anchor="start" >peak · spread · 2nd peak</text>
</g><g class="float" style="animation-delay:-2.1s">
<rect x="913" y="50" width="247" height="128" rx="18" fill="#0B2218" stroke="#22573F"/>
<circle cx="943" cy="82" r="13" fill="none" stroke="#E6C35C"/>
<circle cx="943" cy="82" r="4.5" fill="#F5E2A0" class="pulse" style="animation-delay:1.5s"/>
<text x="967" y="87" class="mono" font-size="11" fill="#8FAA9A" text-anchor="start" letter-spacing="2">04</text>
<text x="935" y="132" class="serif" font-size="26" fill="#EFF6F0" text-anchor="start" >Validate</text>
<text x="935" y="156" class="mono" font-size="12" fill="#C6D9CD" text-anchor="start" >vs Kinovea: RMSE, PCK</text>
</g><path d="M292 114H324" fill="none" stroke="#E6C35C" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M318 109l7 5-7 5" fill="none" stroke="#E6C35C"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.0s" path="M292 114H324"/></circle><path d="M583 114H615" fill="none" stroke="#E6C35C" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M609 109l7 5-7 5" fill="none" stroke="#E6C35C"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.4s" path="M583 114H615"/></circle><path d="M874 114H906" fill="none" stroke="#E6C35C" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M900 109l7 5-7 5" fill="none" stroke="#E6C35C"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.8s" path="M874 114H906"/></circle>
</svg>
